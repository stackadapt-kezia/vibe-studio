<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StackAdapt Vibe studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000; --panel: #0b0b0d; --panel-2: #141418; --line: #232329;
    --text: #eceef4; --muted: #85899a; --accent: #3d84ff; --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 400 14px/1.5 "Source Sans 3", system-ui, sans-serif;
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 18px; border-bottom: 1px solid var(--line); flex: 0 0 auto;
  }
  .sa-logo { height: 20px; width: auto; color: var(--text); }
  .title {
    font: 600 15px/1 "Space Grotesk", sans-serif; letter-spacing: -.01em;
  }
  .backlink {
    margin-left: auto; color: var(--muted); text-decoration: none;
    font: 500 10px/1.3 "Space Grotesk", sans-serif; text-transform: uppercase;
    letter-spacing: .05em; border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 12px;
  }
  .backlink:hover { color: var(--text); }
  .ver { color: var(--muted); font-size: 12px; }
  .app { flex: 1; display: flex; min-height: 0; }
  .panel {
    width: 300px; flex: 0 0 300px; background: var(--panel);
    border-right: 1px solid var(--line); overflow-y: auto; padding: 16px;
  }
  .stage {
    flex: 1; min-width: 0; position: relative; background: #000;
    display: flex; align-items: center; justify-content: center;
  }
  canvas { display: block; width: 100%; height: 100%; }
  body.hide-ui .panel, body.hide-ui header { display: none; }
  .showui { display: none; }
  body.hide-ui .showui {
    display: block; position: fixed; top: 14px; left: 14px; z-index: 50;
    width: auto; margin: 0; opacity: .35; background: rgba(0,0,0,.6);
  }
  body.hide-ui .showui:hover { opacity: 1; }
  fieldset {
    border: 0; padding: 0; margin: 0 0 20px;
    min-inline-size: 0; min-width: 0;   /* fieldsets default to min-content width */
  }
  legend {
    font: 500 10px/1 "Space Grotesk", sans-serif; letter-spacing: .12em;
    text-transform: uppercase; color: var(--muted); padding: 0 0 10px;
  }
  .row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .row label { flex: 0 0 86px; font-size: 13px; color: var(--muted); }
  .row input[type=range] { flex: 1; accent-color: var(--accent); min-width: 0; }
  .row output {
    flex: 0 0 38px; text-align: right; font-size: 12px; color: var(--muted);
    font-variant-numeric: tabular-nums; cursor: text;
  }
  .row output:hover { color: var(--accent); }
  .num {
    flex: 0 0 54px; width: 54px; background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 4px; color: var(--text);
    padding: 4px 6px; font: inherit; font-size: 12px; text-align: right;
  }
  .num:focus { outline: none; border-color: var(--accent); }
  .seg { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .seg button, .pill {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
    padding: 9px 10px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .seg button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  #styleSeg button:nth-child(5) { grid-column: span 2; }
  .seg button:not(.active):hover, .pill:hover { color: var(--text); background: #1b1b21; }
  .pill { width: 100%; margin-top: 8px; color: var(--text); }
  .pill.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  select, input[type=text] {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 5px;
    color: var(--text); padding: 8px 10px; font: inherit; font-size: 13px; width: 100%;
  }
  .pal-wrap { display: flex; gap: 12px; align-items: stretch; }
  .pal-pill { position: relative; width: 30px; flex: 0 0 30px; }
  .pal-pill canvas {
    width: 100%; height: 100%; border-radius: 999px;
    border: 1px solid var(--line); display: block;
  }
  .pal-stop {
    position: absolute; left: -10px; right: -10px; height: 22px; margin-top: -11px;
    cursor: ns-resize; touch-action: none;
  }
  .pal-stop::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 16px; height: 16px; border-radius: 50%;
    transform: translate(-50%, -50%);
    background: var(--c, #fff); border: 2px solid #fff;
    box-shadow: 0 0 0 1px rgba(0,0,0,.5), 0 1px 4px rgba(0,0,0,.45);
  }
  .pal-stop:hover::after, .pal-stop.drag::after {
    width: 20px; height: 20px; border-color: var(--accent);
  }
  .pal-stop.to-front::after { border-color: #fff; box-shadow: 0 0 0 3px var(--accent); }
  .pal-stop.fixed { cursor: default; }
  .pal-stop.fixed:hover::after { width: 16px; height: 16px; border-color: #fff; }
  .pal-rows { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .swatch { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .swatch input[type=color] {
    width: 30px; height: 28px; padding: 0; border: 1px solid var(--line);
    border-radius: 5px; background: none; cursor: pointer; flex: 0 0 30px;
  }
  .swatch input[type=text] { flex: 1; min-width: 0; }
  .swatch button, .lib-x {
    background: none; border: 0; color: var(--muted); cursor: pointer;
    font-size: 15px; padding: 2px 6px; border-radius: 5px;
  }
  .swatch button:hover { color: var(--text); background: var(--panel-2); }
  .sep { height: 1px; background: var(--line); margin: 18px 0 0; }
  .meters { display: flex; gap: 6px; align-items: flex-end; height: 46px; margin: 30px 0 14px; }
  .meter { flex: 1; background: var(--panel-2); border-radius: 4px; position: relative; height: 100%; }
  .meter i {
    position: absolute; left: 0; right: 0; bottom: 0; border-radius: 4px;
    background: var(--accent); height: 0%; display: block;
  }
  .meter span {
    position: absolute; top: -16px; left: 0; font-size: 10px; color: var(--muted);
    letter-spacing: .1em; text-transform: uppercase;
  }
  .note { color: var(--muted); font-size: 12px; margin: 8px 0 0; }
  .note.warn { color: #ffb37a; }
  .hint {
    position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%);
    color: var(--muted); font-size: 12px; background: rgba(0,0,0,.55);
    padding: 6px 12px; border-radius: 999px; pointer-events: none;
  }
</style>
</head>

  <span class="ver" id="ver"></span>
</header>
<div class="app">
  <aside class="panel">
    <fieldset>
      <legend>Sound in</legend>
      <div class="seg" id="srcSeg">
        <button data-src="mic">Microphone</button>
        <button data-src="file">Audio file</button>
      </div>
      <input type="file" id="audioFile" accept="audio/*" hidden>
      <div class="sep"></div>
      <div class="meters">
        <div class="meter"><span>Bass</span><i id="mBass"></i></div>
        <div class="meter"><span>Mid</span><i id="mMid"></i></div>
        <div class="meter"><span>High</span><i id="mHigh"></i></div>
      </div>
      <div id="audioRows"></div>
      <p class="note" id="srcNote">Idle — pick a sound source to react to audio.</p>
    </fieldset>

    <fieldset>
      <legend>Pattern</legend>
      <div class="seg" id="styleSeg">
        <button data-style="0">Blobs</button>
        <button data-style="1">Plasma</button>
        <button data-style="2">Waves</button>
        <button data-style="3">Fractal</button>
        <button data-style="4">Oscilloscope</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>Palette</legend>
      <select id="preset" aria-label="Palette preset">
        <option value="custom">Custom</option>
        <optgroup label="StackAdapt core">
          <option value="sa-light" selected>StackAdapt Light</option>
          <option value="sa-dark">StackAdapt Dark</option>
        </optgroup>
        <optgroup label="Event kits — not core brand">
          <option value="cv27-miami">Conversion 2027: Miami</option>
        </optgroup>
      </select>
      <div id="swatches" style="margin-top:10px"></div>
      <button class="pill" id="addColor">Add color</button>
    </fieldset>

    <fieldset>
      <legend>Look</legend>
      <div id="lookRows"></div>
    </fieldset>

    <fieldset>
      <legend>Reactivity</legend>
      <div id="modRows"></div>
    </fieldset>

    <fieldset>
      <legend>Output</legend>
      <button class="pill" id="fsBtn">Fullscreen (projector)</button>
      <button class="pill" id="hideBtn">Hide panel — H</button>
      <button class="pill" id="recBtn">Record performance</button>
      <p class="note" id="outNote">Drag this window to the projector display, then go fullscreen.</p>
    </fieldset>
  </aside>
  <button class="pill showui" id="showBtn">Show panel</button>
  <main class="stage" id="stage">
    <canvas id="gl"></canvas>
    <div class="hint" id="hint">F — fullscreen · H — hide panel · Esc — exit</div>
  </main>
</div>
<script>
const APP_VERSION = "0.2.2";  // oscilloscope trace no longer stair-steps (16-bit samples)
const $ = id => document.getElementById(id);
$("ver").textContent = "v" + APP_VERSION;

/* ================= state ================= */
const PRESETS = {
  "sa-light": ["#0061FF", "#7FDFFD", "#FFFFFF", "#EE5714"],
  "sa-dark": ["#0061FF", "#7FDFFD", "#000000", "#EE5714"],
  "cv27-miami": ["#FD6D73", "#06BDE0", "#0061FF", "#EE5FE6", "#006C67", "#FBBE49", "#FF9BF9"],
};
const state = {
  style: 0,
  colors: [...PRESETS["sa-light"]],
  weights: [],
  scale: 1, speed: 1, warp: 0.4, blobs: 5,
  trails: 0.45, fbZoom: 0.004, fbSpin: 0.002,
  grain: 0.08, bands: 0,
  modSize: 0.9, modMotion: 0.7, modGrain: 0.5, modFlash: 0.6,
  gain: 1.6, smooth: 0.7,
};

const LOOK = [
  ["scale", "Scale", 0.4, 2, 0.01, v => v.toFixed(2)],
  ["speed", "Speed", 0, 3, 0.01, v => v.toFixed(2)],
  ["warp", "Warp", 0, 1, 0.01, v => v.toFixed(2)],
  ["blobs", "Blobs", 2, 8, 1, v => String(v)],
  ["trails", "Trails", 0, 0.97, 0.01, v => v.toFixed(2)],
  ["fbZoom", "Push", -0.02, 0.02, 0.001, v => v.toFixed(3)],
  ["fbSpin", "Spin", -0.02, 0.02, 0.001, v => v.toFixed(3)],
  ["grain", "Grain", 0, 1, 0.01, v => v.toFixed(2)],
  ["bands", "Bands", 0, 8, 1, v => (v < 2 ? "Off" : String(v))],
];
const MODS = [
  ["modSize", "Bass → Size", 0, 2, 0.05, v => v.toFixed(2)],
  ["modMotion", "Mids → Motion", 0, 2, 0.05, v => v.toFixed(2)],
  ["modGrain", "Highs → Grain", 0, 2, 0.05, v => v.toFixed(2)],
  ["modFlash", "Beat → Flash", 0, 1, 0.05, v => v.toFixed(2)],
];
const AUDIO_ROWS = [
  ["gain", "Gain", 0.2, 4, 0.05, v => v.toFixed(2)],
  ["smooth", "Smoothing", 0, 0.95, 0.05, v => v.toFixed(2)],
];

function buildRows(host, spec) {
  spec.forEach(([key, label, min, max, step]) => {
    const row = document.createElement("div");
    row.className = "row";
    const lb = document.createElement("label");
    lb.textContent = label;
    lb.htmlFor = "s_" + key;
    const el = document.createElement("input");
    el.type = "range"; el.id = "s_" + key;
    el.min = min; el.max = max; el.step = step; el.value = state[key];
    const num = document.createElement("input");
    num.type = "number"; num.className = "num";
    num.min = min; num.max = max; num.step = step; num.value = state[key];
    num.setAttribute("aria-label", label + " value");
    el.addEventListener("input", () => { state[key] = +el.value; num.value = el.value; });
    num.addEventListener("input", () => {
      const v = +num.value;
      if (Number.isNaN(v)) return;
      state[key] = Math.max(min, Math.min(max, v));
      el.value = String(state[key]);
    });
    num.addEventListener("blur", () => { num.value = String(state[key]); });
    row.append(lb, el, num);
    host.append(row);
  });
}
buildRows($("lookRows"), LOOK);
buildRows($("modRows"), MODS);
buildRows($("audioRows"), AUDIO_ROWS);

/* ================= palette ================= */
const palData = new Uint8Array(256 * 4);
function hexToRgb(h) {
  h = h.replace("#", "");
  if (h.length === 3) h = [...h].map(c => c + c).join("");
  return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
}
function stopFractions() {
  const w = state.weights.map(x => Math.max(0.05, +x || 1));
  const sum = w.reduce((a, b) => a + b, 0);
  const fr = [];
  let acc = 0;
  for (let i = 0; i < w.length - 1; i++) { acc += w[i]; fr.push(acc / sum); }
  return fr;
}
function buildPalette() {
  const cols = state.colors.map(hexToRgb);
  const n = cols.length;
  if (state.weights.length !== n) state.weights = cols.map(() => 100);
  const w = state.weights.map(x => Math.max(0.05, +x || 1));
  const sum = w.reduce((a, b) => a + b, 0);
  const stops = [0];
  for (let i = 0; i < n; i++) stops.push(stops[i] + w[i] / sum);
  stops[n] = 1;
  let seg = 0;
  for (let i = 0; i < 256; i++) {
    const t = i / 255;
    while (seg < n - 1 && t >= stops[seg + 1]) seg++;
    const span = stops[seg + 1] - stops[seg];
    const f = span > 0 ? (t - stops[seg]) / span : 0;
    const a = cols[seg], b = cols[(seg + 1) % n];
    palData[i * 4] = a[0] + (b[0] - a[0]) * f;
    palData[i * 4 + 1] = a[1] + (b[1] - a[1]) * f;
    palData[i * 4 + 2] = a[2] + (b[2] - a[2]) * f;
    palData[i * 4 + 3] = 255;
  }
  palDirty = true;
  updatePill();
}
let palPillCanvas = null, palPillBox = null;
function updatePill() {
  if (!palPillCanvas) return;
  const x = palPillCanvas.getContext("2d");
  const W = palPillCanvas.width, H = palPillCanvas.height;
  for (let y = 0; y < H; y++) {
    const i = Math.min(255, Math.floor(y / H * 256)) * 4;
    x.fillStyle = "rgb(" + palData[i] + "," + palData[i + 1] + "," + palData[i + 2] + ")";
    x.fillRect(0, y, W, 1);
  }
}
function buildStops() {
  if (!palPillBox) return;
  palPillBox.querySelectorAll(".pal-stop").forEach(el => el.remove());
  const n = state.colors.length;
  if (n < 2) return;
  const frs = stopFractions();
  for (let i = 0; i < n; i++) {
    const f = i === 0 ? 0 : frs[i - 1];
    const h = document.createElement("div");
    h.className = "pal-stop" + (i === 0 ? " fixed" : "");
    h.style.top = (f * 100) + "%";
    h.style.setProperty("--c", state.colors[i]);
    if (i === 0) h.title = "First color anchors the top of the ramp";
    else {
      h.title = "Drag to balance color " + i + " and color " + (i + 1)
        + ". Drag past a neighbour to reorder, or to the top to make it first.";
      h.addEventListener("pointerdown", e => dragStop(e, i));
    }
    palPillBox.append(h);
  }
}
// Stop i marks where color i begins: the boundary between colors i-1 and i.
// Dragging it rebalances those two weights. Dragging it past the stop above or
// below swaps color i with that neighbour, so the ramp can be reordered by hand,
// and dropping it above the seam makes it the first color.
// The pill box (not the stop) holds pointer capture, so stops can be rebuilt
// mid-drag when colors swap.
function dragStop(e, i) {
  e.preventDefault();
  const box = palPillBox;
  box.setPointerCapture(e.pointerId);
  const rect = box.getBoundingClientRect();
  const GAP = 0.02;                                   // minimum band height, as a fraction of the pill
  const w = state.weights.map(x => Math.max(0.05, +x || 1));
  const sum = w.reduce((a, b) => a + b, 0);
  // each color's height when the drag began, keyed by its starting slot, so a
  // color that gets hopped over comes back at the size it had
  const origH = w.map(x => x / sum);
  const slot = state.colors.map((_, k) => k);
  const starts = () => [0, ...stopFractions(), 1];   // starts[k] = top of color k
  const stops = () => box.querySelectorAll(".pal-stop");
  const full = v => v.length === 4 ? "#" + [...v.slice(1)].map(c => c + c).join("") : v;
  const syncRow = k => {
    const row = box.parentElement.querySelectorAll(".swatch")[k];
    if (!row) return;
    row.querySelector("input[type=color]").value = full(state.colors[k]);
    row.querySelector("input[type=text]").value = state.colors[k].toUpperCase();
  };
  const swap = (a, b) => {
    [state.colors[a], state.colors[b]] = [state.colors[b], state.colors[a]];
    [slot[a], slot[b]] = [slot[b], slot[a]];
    syncRow(a); syncRow(b);
    buildStops();
  };
  let toFront = false;
  const move = ev => {
    const f = (ev.clientY - rect.top) / rect.height;
    toFront = f <= GAP;
    let s = starts();
    if (f > s[i + 1] + GAP / 2 && i + 1 < state.colors.length) {
      // pushed below the next stop: color i hops under color i+1, which keeps its height
      const P = s[i + 1];
      const top = Math.max(s[i - 1] + GAP, P - origH[slot[i + 1]]);
      state.weights[i - 1] = (top - s[i - 1]) * sum;
      state.weights[i] = (P - top) * sum;
      state.weights[i + 1] = (s[i + 2] - P) * sum;
      swap(i, i + 1); i++;
      s = starts();
    } else if (f < s[i - 1] - GAP / 2 && i > 1) {
      // pulled above the previous stop: color i hops over color i-1, which keeps its height
      const P = s[i - 1];
      const bottom = Math.max(P + GAP, s[i + 1] - origH[slot[i - 1]]);
      state.weights[i - 1] = (bottom - P) * sum;
      state.weights[i] = (s[i + 1] - bottom) * sum;
      swap(i - 1, i); i--;
      s = starts();
    }
    const fc = Math.max(s[i - 1] + GAP, Math.min(s[i + 1] - GAP, f));
    state.weights[i - 1] = (fc - s[i - 1]) * sum;
    state.weights[i] = (s[i + 1] - fc) * sum;
    const h = stops()[i];
    h.classList.add("drag");
    h.classList.toggle("to-front", toFront);
    h.style.top = (fc * 100) + "%";
    buildPalette();
    $("preset").value = "custom";
  };
  const up = () => {
    stops().forEach(el => el.classList.remove("drag", "to-front"));
    box.removeEventListener("pointermove", move);
    box.removeEventListener("pointerup", up);
    box.removeEventListener("pointercancel", up);
    if (toFront) {
      // dropped above the seam: this color takes the top of the ramp
      state.colors.unshift(state.colors.splice(i, 1)[0]);
      state.weights.unshift(state.weights.splice(i, 1)[0]);
      buildPalette();
      renderSwatches();
    }
  };
  stops()[i].classList.add("drag");
  box.addEventListener("pointermove", move);
  box.addEventListener("pointerup", up);
  box.addEventListener("pointercancel", up);
}
let palDirty = true;

function renderSwatches() {
  const host = $("swatches");
  host.innerHTML = "";
  const wrap = document.createElement("div");
  wrap.className = "pal-wrap";
  const pill = document.createElement("div");
  pill.className = "pal-pill";
  const pc = document.createElement("canvas");
  pc.width = 30; pc.height = 240;
  pill.append(pc);
  const rows = document.createElement("div");
  rows.className = "pal-rows";
  wrap.append(pill, rows);
  host.append(wrap);
  palPillCanvas = pc;
  palPillBox = pill;
  state.colors.forEach((hex, i) => {
    const row = document.createElement("div");
    row.className = "swatch";
    const pick = document.createElement("input");
    pick.type = "color"; pick.value = hex;
    pick.setAttribute("aria-label", "Color " + (i + 1));
    const txt = document.createElement("input");
    txt.type = "text"; txt.value = hex.toUpperCase(); txt.maxLength = 7; txt.spellcheck = false;
    const del = document.createElement("button");
    del.textContent = "×";
    del.setAttribute("aria-label", "Remove color " + (i + 1));
    del.disabled = state.colors.length <= 2;
    pick.addEventListener("input", () => {
      state.colors[i] = pick.value; txt.value = pick.value.toUpperCase();
      buildPalette(); $("preset").value = "custom";
    });
    txt.addEventListener("change", () => {
      let v = txt.value.trim();
      if (!v.startsWith("#")) v = "#" + v;
      if (/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v)) {
        state.colors[i] = v; pick.value = v.length === 4
          ? "#" + [...v.slice(1)].map(c => c + c).join("") : v;
        buildPalette(); $("preset").value = "custom";
      } else txt.value = state.colors[i].toUpperCase();
    });
    del.addEventListener("click", () => {
      state.colors.splice(i, 1);
      state.weights.splice(i, 1);
      buildPalette(); renderSwatches(); $("preset").value = "custom";
    });
    row.append(pick, txt, del);
    rows.append(row);
  });
  buildStops();
  updatePill();
}
$("addColor").addEventListener("click", () => {
  if (state.colors.length >= 8) return;
  state.colors.push("#7FDFFD");
  state.weights.push(100);
  buildPalette(); renderSwatches(); $("preset").value = "custom";
});
$("preset").addEventListener("change", e => {
  const p = PRESETS[e.target.value];
  if (!p) return;
  state.colors = [...p];
  state.weights = p.map(() => 100);
  buildPalette(); renderSwatches();
});
buildPalette(); renderSwatches();   // palette first: the stops are positioned from state.weights

/* ================= segmented buttons ================= */
function seg(id, attr, get, set) {
  const host = $(id);
  const sync = () => host.querySelectorAll("button").forEach(b =>
    b.classList.toggle("active", b.dataset[attr] === String(get())));
  host.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    set(b.dataset[attr]);
    sync();
  });
  sync();
  return sync;
}
seg("styleSeg", "style", () => state.style, v => { state.style = +v; });

/* ================= WebGL ================= */
const canvas = $("gl");
const gl = canvas.getContext("webgl2", { antialias: false, preserveDrawingBuffer: true })
        || canvas.getContext("webgl", { antialias: false, preserveDrawingBuffer: true });
if (!gl) {
  document.body.innerHTML = '<p style="padding:40px;font:16px sans-serif;color:#eceef4">' +
    'This browser has WebGL disabled. Vibe studio needs it \u2014 try Chrome.</p>';
  throw new Error("no webgl");
}

const VERT = `
attribute vec2 a;
void main() { gl_Position = vec4(a, 0.0, 1.0); }`;

const WAVE_N = 512;             // samples across the oscilloscope texture
const FRAG = `
precision highp float;
#define WAVE_N ${WAVE_N}.0
uniform vec2 u_res;
uniform float u_time;
uniform int u_style;
uniform sampler2D u_pal;
uniform sampler2D u_prev;
uniform sampler2D u_wave;
uniform float u_trails, u_fbZoom, u_fbSpin;
uniform float u_bass, u_mid, u_high, u_beat;
uniform float u_scale, u_warp, u_grain, u_bands, u_blobs;

float hash(float n) { return fract(sin(n * 78.233) * 43758.5453123); }
float hash2(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

// The waveform texture holds 16-bit samples split across R (high byte) and
// G (low byte). Hardware filtering would blend the two bytes separately, so
// the texture is NEAREST and the two neighbours are decoded and mixed here.
float waveAt(float i) {
  vec2 s = texture2D(u_wave, vec2((i + 0.5) / WAVE_N, 0.5)).rg;
  return (s.r * 65280.0 + s.g * 255.0) / 65535.0 * 2.0 - 1.0;
}
float wave(float x) {
  float fx = x * WAVE_N - 0.5;
  float i0 = floor(fx);
  return mix(waveAt(i0), waveAt(i0 + 1.0), fx - i0);
}

vec3 pal(float t) {
  t = clamp(t, 0.0, 1.0);
  if (u_bands >= 2.0) t = (floor(t * u_bands) + 0.5) / u_bands;
  return texture2D(u_pal, vec2(t, 0.5)).rgb;
}

void main() {
  vec2 uv = gl_FragCoord.xy / u_res;
  vec2 p = (gl_FragCoord.xy - 0.5 * u_res) / u_res.y;
  float T = u_time;
  float v = 0.0;

  if (u_style == 0) {
    float f = 0.0;
    for (int i = 0; i < 8; i++) {
      float fi = float(i);
      float w = clamp(u_blobs - fi, 0.0, 1.0);
      float a = hash(fi + 1.3) * 6.2831;
      float sp = 0.25 + hash(fi + 4.1) * 0.45;
      float rad = (0.16 + hash(fi + 7.9) * 0.16) * u_scale;
      vec2 c = vec2(cos(T * sp + a), sin(T * sp * 1.27 + a * 1.7)) * (0.40 + 0.30 * hash(fi + 2.2));
      vec2 dd = p - c;
      f += w * rad * rad / (dot(dd, dd) + 0.0015);
    }
    v = 1.0 - exp(-f * 0.75);
  } else if (u_style == 1) {
    vec2 q = p * (2.0 + u_warp * 5.0) / u_scale;
    float s = sin(q.x + T) + sin(q.y * 1.3 - T * 0.7)
            + sin((q.x + q.y) * 0.8 + T * 1.3) + sin(length(q) * 2.2 - T * 1.6);
    v = 0.5 + 0.125 * s;
  } else if (u_style == 2) {
    float band = p.y * (3.0 / u_scale) + sin(p.x * 4.0 + T) * u_warp * 1.6 + T * 0.25;
    v = abs(fract(band * 0.5) * 2.0 - 1.0);
  } else if (u_style == 4) {
    // oscilloscope: the live waveform texture, drawn as a glowing trace
    float wv = wave(uv.x);
    float amp = 0.42 * u_scale * (1.0 + u_bass * 0.6);
    float d = abs(p.y - wv * amp);
    float th = mix(0.006, 0.06, u_warp);
    v = pow(clamp(1.0 - d / th, 0.0, 1.0), 1.4);
  } else {
    vec2 z = p * 1.7 / u_scale;
    vec2 c = 0.7885 * vec2(cos(T * 0.25), sin(T * 0.25));
    float it = 0.0;
    for (int i = 0; i < 48; i++) {
      z = vec2(z.x * z.x - z.y * z.y, 2.0 * z.x * z.y) + c;
      if (dot(z, z) > 4.0) break;
      it += 1.0;
    }
    v = sqrt(it / 48.0);
  }

  vec3 col = pal(v);

  vec2 fuv = uv - 0.5;
  float ca = u_fbSpin;
  fuv = mat2(cos(ca), -sin(ca), sin(ca), cos(ca)) * fuv * (1.0 - u_fbZoom);
  vec3 prev = texture2D(u_prev, fuv + 0.5).rgb;
  col = mix(col, max(col * 0.75, prev * 0.985), u_trails);

  float g = hash2(gl_FragCoord.xy + fract(T) * 421.0) - 0.5;
  col += g * u_grain * 0.4;
  col *= 1.0 + u_beat * 0.6;

  gl_FragColor = vec4(col, 1.0);
}`;

const COPY = `
precision highp float;
uniform sampler2D u_tex;
uniform vec2 u_res;
void main() { gl_FragColor = texture2D(u_tex, gl_FragCoord.xy / u_res); }`;

function compile(src, type) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function program(fragSrc) {
  const p = gl.createProgram();
  gl.attachShader(p, compile(VERT, gl.VERTEX_SHADER));
  gl.attachShader(p, compile(fragSrc, gl.FRAGMENT_SHADER));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
const scene = program(FRAG), copy = program(COPY);

const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
[scene, copy].forEach(p => {
  const loc = gl.getAttribLocation(p, "a");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
});

const waveTex = gl.createTexture();
const waveArr = new Uint8Array(WAVE_N * 4);
// store a sample in [-1, 1] as 16 bits: R = high byte, G = low byte
function putSample(i, v) {
  const q = Math.round((Math.max(-1, Math.min(1, v)) * 0.5 + 0.5) * 65535);
  waveArr[i * 4] = q >> 8;
  waveArr[i * 4 + 1] = q & 255;
  waveArr[i * 4 + 3] = 255;
}
gl.bindTexture(gl.TEXTURE_2D, waveTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

const palTex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, palTex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

function makeTarget(w, h) {
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  const fb = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return { tex, fb, w, h };
}
let A = null, B = null;
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  let w = Math.max(2, Math.round(canvas.clientWidth * dpr));
  let h = Math.max(2, Math.round(canvas.clientHeight * dpr));
  const cap = 2600000;                       // keep the pixel budget sane on 4K panels
  if (w * h > cap) { const s = Math.sqrt(cap / (w * h)); w = Math.round(w * s); h = Math.round(h * s); }
  if (canvas.width === w && canvas.height === h) return;
  canvas.width = w; canvas.height = h;
  A = makeTarget(w, h); B = makeTarget(w, h);
}
addEventListener("resize", resize);

/* ================= audio ================= */
let timeData = null;
let actx = null, analyser = null, freq = null, srcNode = null, audioEl = null,
    micStream = null, dest = null, sampleRate = 48000;
const band = { bass: 0, mid: 0, high: 0 };
let beatEnv = 0, bassAvg = 0, lastBeat = 0;

function bandLevel(loHz, hiHz) {
  const n = freq.length;
  const lo = Math.max(0, Math.floor(loHz / (sampleRate / 2) * n));
  const hi = Math.min(n - 1, Math.ceil(hiHz / (sampleRate / 2) * n));
  let s = 0;
  for (let i = lo; i <= hi; i++) s += freq[i];
  return s / ((hi - lo + 1) * 255);
}
async function ensureCtx() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = actx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.smoothingTimeConstant = 0.55;
    freq = new Uint8Array(analyser.frequencyBinCount);
    dest = actx.createMediaStreamDestination();
    sampleRate = actx.sampleRate;
  }
  if (actx.state === "suspended") await actx.resume();
}
function disconnectSource() {
  if (srcNode) { try { srcNode.disconnect(); } catch (e) { /* already gone */ } srcNode = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (audioEl) { audioEl.pause(); audioEl = null; }
}
async function useMic() {
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.isSecureContext) {
      $("srcNote").className = "note warn";
      $("srcNote").textContent = "The browser won't allow microphone access on this page. "
        + "Mic input needs the deployed https:// address — a file:// copy opened from disk can't ask for permission. "
        + "Audio file works either way.";
      srcMode = "none"; segSrc();
      return;
    }
    $("srcNote").className = "note";
    $("srcNote").textContent = "Asking for microphone permission…";
    await ensureCtx();
    disconnectSource();
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
    });
    srcNode = actx.createMediaStreamSource(micStream);
    srcNode.connect(analyser);
    srcNode.connect(dest);          // recorded, but never back to the speakers
    $("srcNote").textContent = "Listening to the microphone.";
    segSrc();
  } catch (err) {
    $("srcNote").className = "note warn";
    $("srcNote").textContent = err.name === "NotAllowedError"
      ? "Microphone permission was denied — allow it in the address-bar icon, then click Microphone again."
      : "Microphone unavailable: " + err.message;
    srcMode = "none"; segSrc();
  }
}
async function useFile(file) {
  await ensureCtx();
  disconnectSource();
  audioEl = new Audio(URL.createObjectURL(file));
  audioEl.loop = true;
  audioEl.crossOrigin = "anonymous";
  srcNode = actx.createMediaElementSource(audioEl);
  srcNode.connect(analyser);
  srcNode.connect(dest);
  srcNode.connect(actx.destination);   // you hear the track
  await audioEl.play();
  $("srcNote").textContent = "Playing " + file.name + " (looping).";
  segSrc();
}
let srcMode = "none";
const segSrc = seg("srcSeg", "src", () => srcMode, v => {
  srcMode = v;
  if (v === "mic") useMic();
  else if (v === "file") $("audioFile").click();
});
$("audioFile").addEventListener("change", e => {
  const f = e.target.files[0];
  if (f) useFile(f);
  else { srcMode = "none"; segSrc(); }
  e.target.value = "";
});

/* ================= render loop ================= */
let T = 0, last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  resize();

  if (analyser) {
    if (!timeData || timeData.length !== analyser.fftSize) timeData = new Float32Array(analyser.fftSize);
    analyser.getFloatTimeDomainData(timeData);
    const stride = timeData.length / WAVE_N;
    for (let i = 0; i < WAVE_N; i++) putSample(i, timeData[Math.floor(i * stride)] * state.gain);
  } else {
    // idle: a gentle sine so the scope still reads as alive with no input
    for (let i = 0; i < WAVE_N; i++) {
      const x = i / WAVE_N;
      putSample(i, Math.sin(x * Math.PI * 4 + T * 1.6) * 0.55 * (0.5 + 0.4 * Math.sin(T * 0.6)));
    }
  }
  if (analyser) {
    analyser.getByteFrequencyData(freq);
    const g = state.gain, k = state.smooth;
    const b = Math.min(1, bandLevel(20, 200) * g);
    const m = Math.min(1, bandLevel(200, 2000) * g * 1.5);
    const h = Math.min(1, bandLevel(2000, 9000) * g * 2.2);
    band.bass += (b - band.bass) * (1 - k);
    band.mid += (m - band.mid) * (1 - k);
    band.high += (h - band.high) * (1 - k);
    bassAvg += (b - bassAvg) * 0.04;
    if (b > bassAvg * 1.32 && b > 0.12 && now - lastBeat > 160) { beatEnv = 1; lastBeat = now; }
  } else {
    band.bass = band.mid = band.high = 0;
  }
  beatEnv *= Math.pow(0.0025, dt);

  $("mBass").style.height = (band.bass * 100) + "%";
  $("mMid").style.height = (band.mid * 100) + "%";
  $("mHigh").style.height = (band.high * 100) + "%";

  T += dt * state.speed * (1 + band.mid * state.modMotion);

  gl.bindFramebuffer(gl.FRAMEBUFFER, A.fb);
  gl.viewport(0, 0, A.w, A.h);
  gl.useProgram(scene);
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.vertexAttribPointer(gl.getAttribLocation(scene, "a"), 2, gl.FLOAT, false, 0, 0);

  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, palTex);
  if (palDirty) {
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 256, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, palData);
    palDirty = false;
  }
  gl.uniform1i(gl.getUniformLocation(scene, "u_pal"), 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, B.tex);
  gl.uniform1i(gl.getUniformLocation(scene, "u_prev"), 1);
  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_2D, waveTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, WAVE_N, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, waveArr);
  gl.uniform1i(gl.getUniformLocation(scene, "u_wave"), 2);

  const U = n => gl.getUniformLocation(scene, n);
  gl.uniform2f(U("u_res"), A.w, A.h);
  gl.uniform1f(U("u_time"), T);
  gl.uniform1i(U("u_style"), state.style);
  gl.uniform1f(U("u_trails"), state.trails);
  gl.uniform1f(U("u_fbZoom"), state.fbZoom);
  gl.uniform1f(U("u_fbSpin"), state.fbSpin);
  gl.uniform1f(U("u_bass"), band.bass);
  gl.uniform1f(U("u_mid"), band.mid);
  gl.uniform1f(U("u_high"), band.high);
  gl.uniform1f(U("u_beat"), beatEnv * state.modFlash);
  gl.uniform1f(U("u_scale"), state.scale * (1 + band.bass * state.modSize));
  gl.uniform1f(U("u_warp"), state.warp);
  gl.uniform1f(U("u_grain"), Math.min(1.5, state.grain + band.high * state.modGrain));
  gl.uniform1f(U("u_bands"), state.bands);
  gl.uniform1f(U("u_blobs"), state.blobs);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(copy);
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.vertexAttribPointer(gl.getAttribLocation(copy, "a"), 2, gl.FLOAT, false, 0, 0);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, A.tex);
  gl.uniform1i(gl.getUniformLocation(copy, "u_tex"), 0);
  gl.uniform2f(gl.getUniformLocation(copy, "u_res"), canvas.width, canvas.height);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  const t = A; A = B; B = t;      // ping-pong: this frame becomes next frame's history
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);

/* ================= output ================= */
$("fsBtn").addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else $("stage").requestFullscreen().catch(e => { $("outNote").textContent = "Fullscreen blocked: " + e.message; });
});
$("hideBtn").addEventListener("click", () => document.body.classList.add("hide-ui"));
$("showBtn").addEventListener("click", () => document.body.classList.remove("hide-ui"));
addEventListener("keydown", e => {
  if (e.target.matches("input, select, textarea")) return;
  if (e.key === "f") $("fsBtn").click();
  if (e.key === "h") document.body.classList.toggle("hide-ui");
  if (e.key === "Escape") document.body.classList.remove("hide-ui");
});
setTimeout(() => { const el = $("hint"); if (el) el.style.display = "none"; }, 6000);
(() => {
  const link = $("patternLink");
  if (location.protocol === "file:") { link.href = "pattern-studio.html"; return; }
  const u = new URL(location.href);
  u.searchParams.delete("app");
  link.href = u.toString();
})();

let rec = null, chunks = [];
$("recBtn").addEventListener("click", () => {
  if (rec) { rec.stop(); return; }
  const stream = canvas.captureStream(60);
  if (dest && dest.stream.getAudioTracks().length) {
    try { stream.addTrack(dest.stream.getAudioTracks()[0]); } catch (e) { /* video only */ }
  }
  const mime = ["video/mp4", "video/webm;codecs=vp9", "video/webm"]
    .find(m => MediaRecorder.isTypeSupported(m)) || "";
  rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 16000000 });
  chunks = [];
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    const blob = new Blob(chunks, { type: mime || "video/webm" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "vibe-studio." + (mime.includes("mp4") ? "mp4" : "webm");
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    rec = null;
    $("recBtn").textContent = "Record performance";
    $("recBtn").classList.remove("on");
    $("outNote").textContent = "Recording saved.";
  };
  rec.start();
  $("recBtn").textContent = "Stop recording";
  $("recBtn").classList.add("on");
  $("outNote").textContent = "Recording\u2026 this captures the canvas live, with audio if a source is on.";
});
</script>
</body>
</html>
